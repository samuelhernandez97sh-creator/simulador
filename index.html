<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador P2P y Arbitraje</title>
    <!-- Tailwind CSS o estilos base si los usas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased p-4">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Encabezado -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-emerald-400">Simulador de Arbitraje P2P</h1>
            <span id="txtUltimaHora" class="text-xs text-slate-400">Actualizando...</span>
        </header>

        <!-- Panel de Inputs / Configuración -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Monto USD (Tarjeta)</label>
                <input type="number" id="inputMonto" value="500" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Tasa BCV</label>
                <input type="number" step="0.01" id="inputBCV" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Tasa Binance P2P</label>
                <input type="number" step="0.01" id="inputP2P" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Saldo Bs Usuario</label>
                <input type="number" id="inputSaldoBsUsuario" value="0" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
            </div>
        </div>

        <!-- Resultados del Cálculo / Pasos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                <h2 class="text-sm font-semibold text-slate-300">Desglose de Operación</h2>
                <p class="text-xs text-slate-400" id="txtPaso3">$0.00 → 0.00 USDT</p>
                <p class="text-xs text-slate-400" id="txtPaso4">0.00 USDT × Bs 0.00 = Bs 0.00</p>
                <div class="pt-2 border-t border-slate-700 flex justify-between">
                    <span class="text-sm">Costo Total Banco:</span>
                    <span id="txtMontoBanco" class="font-bold text-rose-400">Bs 0,00</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-sm">Monto Binance:</span>
                    <span id="txtMontoBinance" class="font-bold text-blue-400">$ 0,00</span>
                </div>
            </div>

            <!-- Ganancias y Estadísticas -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                <h2 class="text-sm font-semibold text-slate-300">Margen y Ganancia</h2>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400">Porcentaje:</span>
                    <span id="txtGananciaPct" class="text-lg font-bold text-emerald-400">+0.00%</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400">Ganancia en Bs:</span>
                    <span id="txtGananciaBs" class="text-sm font-semibold">Bs 0,00</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400">Ganancia en USDT:</span>
                    <span id="txtGananciaUSDT" class="text-sm font-semibold">0.00 USDT</span>
                </div>
                <div class="flex justify-between pt-2 border-t border-slate-700 text-xs text-slate-400">
                    <span>Máx: <strong id="statMax" class="text-emerald-400">0%</strong></span>
                    <span>Mín: <strong id="statMin" class="text-rose-400">0%</strong></span>
                </div>
            </div>
        </div>

        <!-- Gráfica de Tendencia -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 h-64">
            <canvas id="canvasMargen"></canvas>
        </div>
    </div>

    <script>
        // Configuración de URLs y Variables Globales
        const VERCEL_URL = ""; // Si tu frontend y backend están en el mismo dominio de Vercel, déjalo vacío o pon tu URL base.
        let historialMargen = [];
        let miGrafica = null;
        let maxMargenSession = -999;
        let minMargenSession = 999;

        // Referencias del DOM
        const inputMonto = document.getElementById('inputMonto');
        const inputBCV = document.getElementById('inputBCV');
        const inputP2P = document.getElementById('inputP2P');
        const inputSaldoBsUsuario = document.getElementById('inputSaldoBsUsuario');
        
        const txtPaso3 = document.getElementById('txtPaso3');
        const txtPaso4 = document.getElementById('txtPaso4');
        const txtMontoBanco = document.getElementById('txtMontoBanco');
        const txtMontoBinance = document.getElementById('txtMontoBinance');
        const txtGananciaPct = document.getElementById('txtGananciaPct');
        const txtGananciaBs = document.getElementById('txtGananciaBs');
        const txtGananciaUSDT = document.getElementById('txtGananciaUSDT');
        
        const statMax = document.getElementById('statMax');
        const statMin = document.getElementById('statMin');
        const txtUltimaHora = document.getElementById('txtUltimaHora');

        // Función auxiliar para formatear números al estilo venezolano
        function formatVE(num) {
            if (isNaN(num)) return "0,00";
            return Number(num).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Función para procesar alertas o mensajes del canal de Telegram (si aplica)
        function procesarMensajeCanal(mensaje) {
            console.log("Mensaje de canal detectado:", mensaje);
            // Aquí puedes integrar lógica visual adicional si tu canal reporta caídas o estados de bancos.
        }

        // Núcleo de cálculo del simulador
        function calcularSimulacion() {
            const montoTarjeta = parseFloat(inputMonto.value) || 0;
            const tasaBCV = parseFloat(inputBCV.value) || 0;
            const TasaP2P = parseFloat(inputP2P.value) || 0;

            // Fórmulas base del arbitraje
            const costoTotalBanco = montoTarjeta * (tasaBCV * 1.005); // Ejemplo con comisión bancaria del 0.5%
            const montoUSDT = montoTarjeta; // Asumiendo relación 1:1 inicial en tarjeta
            const ventaBolivares = montoUSDT * TasaP2P;
            
            const gananciaBs = ventaBolivares - costoTotalBanco;
            const gananciaUSDT = costoTotalBanco > 0 ? gananciaBs / TasaP2P - montoTarjeta : 0;
            const porcentajeGanancia = costoTotalBanco > 0 ? ((ventaBolivares - costoTotalBanco) / costoTotalBanco) * 100 : 0;

            // Actualizar interfaz visual
            txtPaso3.textContent = `$${formatVE(montoTarjeta)} → ${formatVE(montoUSDT)} USDT`;
            txtPaso4.textContent = `${formatVE(montoUSDT)} USDT × Bs ${formatVE(TasaP2P)} = Bs ${formatVE(ventaBolivares)}`;
            
            txtMontoBanco.textContent = `Bs ${formatVE(costoTotalBanco)}`;
            txtMontoBinance.textContent = `$ ${formatVE(montoTarjeta)}`;
            txtGananciaPct.textContent = `${porcentajeGanancia >= 0 ? '+' : ''}${formatVE(porcentajeGanancia)}%`;
            txtGananciaBs.textContent = `Bs ${formatVE(gananciaBs)}`;
            txtGananciaUSDT.textContent = `${formatVE(gananciaUSDT)} USDT`;

            if (porcentajeGanancia !== 0) {
                if (porcentajeGanancia > maxMargenSession || maxMargenSession === -999) {
                    maxMargenSession = porcentajeGanancia;
                    statMax.textContent = `${maxMargenSession >= 0 ? '+' : ''}${formatVE(maxMargenSession)}%`;
                }
                if (porcentajeGanancia < minMargenSession || minMargenSession === 999) {
                    minMargenSession = porcentajeGanancia;
                    statMin.textContent = `${minMargenSession >= 0 ? '+' : ''}${formatVE(minMargenSession)}%`;
                }
            }
        }

        // Sincronización con las Serverless Functions de Vercel
        async function obtenerTasasAPI() {
            try {
                const resBCV = await fetch(`${VERCEL_URL}/api/bcv`);
                const dataBCV = await resBCV.json();
                
                if (!dataBCV.success) throw new Error("Error BCV");
                const tasaBCV = dataBCV.bcv;
                inputBCV.value = tasaBCV;

                const montoUSD = parseFloat(inputMonto.value) || 500;
                const costoTotalBanco = montoUSD * (tasaBCV * 1.005);
                const montoBsFiltro = Math.round(costoTotalBanco);

                const resBinanceVivo = await fetch(`${VERCEL_URL}/api/binance-p2p?amount=${montoBsFiltro}`);
                const dataBinance = await resBinanceVivo.json();
                
                if(dataBinance.precio_binance_p2p) {
                    inputP2P.value = dataBinance.precio_binance_p2p;
                }

                if (dataBinance.ultimo_mensaje_canal) {
                    procesarMensajeCanal(dataBinance.ultimo_mensaje_canal);
                }

            } catch (error) {
                console.warn("Modo manual o error de conexión:", error);
            } finally {
                calcularSimulacion();
                actualizarGraficaTendencia();
                
                const ahora = new Date();
                const horaActual = ahora.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                txtUltimaHora.textContent = `Actualizado: ${horaActual}`;
            }
        }

        // Manejo de la Gráfica de Tendencias
        function actualizarGraficaTendencia() {
            const margenActual = parseFloat(txtGananciaPct.textContent.replace('%', '').replace('+', ''));
            if (isNaN(margenActual)) return;

            const ahora = new Date();
            const horaTexto = `${ahora.getHours().toString().padStart(2, '0')}:${ahora.getMinutes().toString().padStart(2, '0')}`;

            historialMargen.push({ hora: horaTexto, margen: margenActual });
            if (historialMargen.length > 15) historialMargen.shift();

            localStorage.setItem('historial_margen_p2p', JSON.stringify(historialMargen));
            renderizarGrafica();
        }

        function renderizarGrafica() {
            const canvas = document.getElementById('canvasMargen');
            if(!canvas) return;
            
            const labels = historialMargen.map(item => item.hora);
            const datos = historialMargen.map(item => item.margen);

            if (miGrafica) {
                miGrafica.data.labels = labels;
                miGrafica.data.datasets[0].data = datos;
                miGrafica.update();
            } else {
                miGrafica = new Chart(canvas.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Margen %',
                            data: datos,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.05)',
                            borderWidth: 2,
                            tension: 0.2,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: '#a0aec0', font: { size: 9 } }, grid: { color: '#2d3748' } },
                            y: { ticks: { color: '#a0aec0', font: { size: 9 } }, grid: { color: '#2d3748' } }
                        }
                    }
                });
            }
        }

        // Event Listeners para inputs manuales
        [inputBCV, inputP2P, inputMonto, inputSaldoBsUsuario].forEach(input => {
            input.addEventListener('input', () => {
                calcularSimulacion();
            });
        });

        // Inicialización al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const historialGuardado = localStorage.getItem('historial_margen_p2p');
            if (historialGuardado) {
                try {
                    historialMargen = JSON.parse(historialGuardado);
                } catch (e) {
                    historialMargen = [];
                }
            }

            obtenerTasasAPI();
            setInterval(obtenerTasasAPI, 30000); // Refresca cada 30 segundos
        });
    </script>
</body>
</html>
