name: Registrar precios

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarla unos minutos)
  workflow_dispatch:          # permite correrla a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: registrar
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar la rama datos
        run: |
          git config user.name "registrador"
          git config user.email "registrador@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git checkout datos
          else
            git checkout --orphan datos
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Consultar precios y guardar una línea
        run: |
          BASE="https://simulador-lemon-one.vercel.app"
          # Vercel distingue mayúsculas: prueba senales y Senales
          S='{}'
          for n in senales Senales; do
            R=$(curl -sS --max-time 45 "$BASE/api/$n?venta=1000000&recompra=20000" || echo '{}')
            if echo "$R" | grep -q '"ok":true'; then S="$R"; echo "API usada: /api/$n"; break; fi
          done
          B=$(curl -sS --max-time 20 "$BASE/api/bcv" || echo '{}')
          S="$S" B="$B" node -e '
            let s, b;
            try { s = JSON.parse(process.env.S); b = JSON.parse(process.env.B || "{}"); } catch (e) { s = {}; b = {}; }
            if (!s.ok) { console.log("::warning::No se pudo leer /api/senales (revisa que el archivo api/senales.js exista en el repo)"); process.exit(0); }
            const r = { t: new Date().toISOString().slice(0, 16) + "Z", v: {}, r: {} };
            if (b.bcv) r.bcv = b.bcv;
            for (const [k, m] of Object.entries(s.metodos || {})) {
              if (m.venta && m.venta.precio > 0) r.v[k] = m.venta.precio;
              if (m.recompra && m.recompra.precio > 0) r.r[k] = m.recompra.precio;
            }
            if (!Object.keys(r.v).length && !Object.keys(r.r).length) { console.log("::warning::Binance no devolvió precios en este momento"); process.exit(0); }
            require("fs").appendFileSync("historial.jsonl", JSON.stringify(r) + "\n");
            console.log("Registro guardado: " + JSON.stringify(r));
          '

      - name: Guardar en la rama datos
        run: |
          if [ -n "$(git status --porcelain historial.jsonl 2>/dev/null)" ]; then
            git add historial.jsonl
            git commit -m "datos $(date -u '+%Y-%m-%d %H:%M')"
            git push origin datos
          fi
